[project]
name = "micu-image-mcp"
version = "0.3.0"
description = "MCP server for 米醋 (micuapi.ai) gpt-image-2 / gpt-image-2-openai"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]==1.28.0",
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.scripts]
micu-image-mcp = "server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
packages = ["micu_image_mcp"]

[tool.setuptools.package-data]
micu_image_mcp = ["tool_contract.json"]
