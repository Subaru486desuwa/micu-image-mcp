name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  MICU_RUN_LIVE_TESTS: "0"
  MICU_RUN_HARNESS_TESTS: "0"

jobs:
  msrv:
    name: Rust 1.88 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --all-targets --all-features

  quality:
    name: Rust contracts, lint, tests, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: POSIX bootstrap syntax
        run: sh -n scripts/install.sh scripts/run-mcp-macos-keychain.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Build servers before black-box acceptance
        run: cargo build --locked --workspace
      - run: cargo xtask source-audit
      - run: cargo test --locked --workspace --all-targets --all-features
      - run: cargo xtask smoke
      - run: cargo xtask stress --processes 4 --rounds 1 --output target/reports/stdio-stress.json
      - run: cargo xtask release-check
      - name: Production source has no panic shortcuts
        run: >-
          cargo clippy --locked --workspace --lib --bins --all-features --
          -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic
      - name: No committed generated output or likely real API key
        shell: bash
        run: |
          if git ls-files | rg '(^|/)(out|output)/|\.(png|jpe?g|webp|gif)$' | rg -v '^docs/'; then
            echo 'generated image/output is tracked' >&2
            exit 1
          fi
          if rg -n 'sk-[A-Za-z0-9]{20,}' --glob '!Cargo.lock' --glob '!.env.example'; then
            echo 'possible API key is committed' >&2
            exit 1
          fi
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: rust-offline-reports
          path: target/reports/

  native-release-build:
    name: ${{ matrix.name }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            artifact: micu-image-mcp-linux-x86_64
            binary: target/release/micu-image-mcp
          - name: macOS x86_64
            os: macos-15-intel
            artifact: micu-image-mcp-macos-x86_64
            binary: target/release/micu-image-mcp
          - name: macOS arm64
            os: macos-15
            artifact: micu-image-mcp-macos-arm64
            binary: target/release/micu-image-mcp
          - name: Windows x86_64
            os: windows-latest
            artifact: micu-image-mcp-windows-x86_64
            binary: target/release/micu-image-mcp.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --all-features
      - run: cargo build --locked --workspace
      - name: Test all Rust targets
        run: cargo test --locked --workspace --all-targets --all-features
      - name: Release binary STDIO smoke
        run: cargo xtask smoke --binary ${{ matrix.binary }}
      - name: Windows issue #4 native paths
        if: runner.os == 'Windows'
        run: |
          cargo test --locked --test config_roundtrip codex_config_windows_backslash_regression_issue_4
          cargo test --locked --test path_matrix windows_root_checks_are_component_aware_and_case_insensitive
          cargo test --locked --test sandbox_paths windows_junction_and_unc_escape_are_rejected
          cargo test --locked --test sandbox_paths windows_unc_share_can_be_the_actual_output_capability_root
      - name: PowerShell bootstrap preflight
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\scripts\install.ps1 -PreflightOnly
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
