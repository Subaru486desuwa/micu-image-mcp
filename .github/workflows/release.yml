name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: micu-image-mcp-linux-x86_64
            binary: target/release/micu-image-mcp
          - os: macos-15-intel
            artifact: micu-image-mcp-macos-x86_64
            binary: target/release/micu-image-mcp
          - os: macos-15
            artifact: micu-image-mcp-macos-arm64
            binary: target/release/micu-image-mcp
          - os: windows-latest
            artifact: micu-image-mcp-windows-x86_64
            binary: target/release/micu-image-mcp.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install -e .
      - run: cargo test --locked --all-targets --all-features
      - run: cargo build --locked --release --all-features
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Rename artifacts and generate SHA-256 checksums
        shell: bash
        run: |
          mkdir dist
          cp artifacts/micu-image-mcp-linux-x86_64/micu-image-mcp dist/micu-image-mcp-linux-x86_64
          cp artifacts/micu-image-mcp-macos-x86_64/micu-image-mcp dist/micu-image-mcp-macos-x86_64
          cp artifacts/micu-image-mcp-macos-arm64/micu-image-mcp dist/micu-image-mcp-macos-arm64
          cp artifacts/micu-image-mcp-windows-x86_64/micu-image-mcp.exe dist/micu-image-mcp-windows-x86_64.exe
          cd dist
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: micu-image-mcp-release
          path: dist/*
          if-no-files-found: error
      - name: Attach files to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
