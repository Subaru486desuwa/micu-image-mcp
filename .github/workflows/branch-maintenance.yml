name: Maintain Rust main and legacy branches

on:
  push:
    branches: [main]
    paths: [.github/workflows/branch-maintenance.yml]
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: branch-maintenance
  cancel-in-progress: false

jobs:
  consolidate:
    if: >-
      github.repository == 'Subaru486desuwa/micu-image-mcp' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Archive audited tips before deleting obsolete branches
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const snapshots = [
              {name: 'main', sha: '29a965267f81725962b1481c3a7e01288ddd0d6e'},
              {name: 'ts-port', sha: '192d0b362de0df47478fc31cbfb8199761cc5e8c'},
              {name: 'python-reference', sha: '578b32ace77bbc732462b4d6483f2259969668ef'},
              {name: 'codex/add-diving-kitten', sha: 'f5f04773e868206e96e10c3c7a6e8b6f11903e5f', retire: true, merged: true},
              {name: 'codex/line-compat-update', sha: 'eb743099a66836f1a1ec3d848f5164f1b9958105', retire: true, merged: true},
              {name: 'rust-port', sha: 'bfda7956e0dd7c4ac3d55ce7ae7f6d845f191f6b', retire: true},
            ];
            async function getRef(ref) {
              try { return (await github.rest.git.getRef({...repo, ref})).data; }
              catch (error) { if (error.status === 404) return null; throw error; }
            }
            async function requireAncestor(base, head) {
              const {data} = await github.rest.repos.compareCommitsWithBasehead({...repo, basehead: `${base}...${head}`});
              if (!['ahead', 'identical'].includes(data.status)) {
                throw new Error(`${base} is not an ancestor of main; refusing cleanup.`);
              }
            }
            const {data: metadata} = await github.rest.repos.get(repo);
            if (metadata.default_branch !== 'main') throw new Error('Default branch must remain main.');
            const main = await getRef('heads/main');
            await requireAncestor(snapshots[0].sha, main.object.sha);
            const pulls = await github.paginate(github.rest.pulls.list, {...repo, state: 'open', per_page: 100});
            const pending = [];
            for (const item of snapshots.filter(item => item.retire)) {
              const ref = await getRef(`heads/${item.name}`);
              if (!ref) { core.info(`${item.name}: already absent`); continue; }
              if (ref.object.sha !== item.sha) throw new Error(`${item.name} changed since the audit; review it again.`);
              const {data: branch} = await github.rest.repos.getBranch({...repo, branch: item.name});
              if (branch.protected) throw new Error(`${item.name} is protected; no settings will be bypassed.`);
              if (pulls.some(pr => pr.base.ref === item.name ||
                  (pr.head.repo?.full_name === `${repo.owner}/${repo.repo}` && pr.head.ref === item.name))) {
                throw new Error(`${item.name} is used by an open pull request.`);
              }
              if (item.merged) await requireAncestor(item.sha, main.object.sha);
              pending.push(item);
            }
            // Save all six audited tips. archive/* never matches the v* release trigger.
            for (const item of snapshots) {
              const ref = `tags/archive/2026-09-rust-main/${item.name}`;
              let archive = await getRef(ref);
              if (!archive) {
                await github.rest.git.createRef({...repo, ref: `refs/${ref}`, sha: item.sha});
                archive = await getRef(ref);
              }
              if (archive.object.sha !== item.sha) throw new Error(`Archive mismatch: ${ref}`);
            }
            for (const item of pending) {
              const current = await getRef(`heads/${item.name}`);
              if (!current || current.object.sha !== item.sha) throw new Error(`${item.name} moved during cleanup.`);
              await github.rest.git.deleteRef({...repo, ref: `heads/${item.name}`});
              core.info(`Archived and deleted ${item.name}`);
            }
            const branches = await github.paginate(github.rest.repos.listBranches, {...repo, per_page: 100});
            await core.summary.addHeading('Branch consolidation')
              .addRaw(`Remaining branches: ${branches.map(branch => branch.name).join(', ')}`)
              .addRaw('\nAudited tips are preserved under archive/2026-09-rust-main/.')
              .write();

  delete-merged-codex-branch:
    if: >-
      github.repository == 'Subaru486desuwa/micu-image-mcp' &&
      github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'codex/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Archive and remove a merged temporary Codex branch
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const pr = context.payload.pull_request;
            const name = pr.head.ref;
            if (!pr.merged || pr.base.ref !== 'main' || !name.startsWith('codex/') ||
                pr.head.repo?.full_name !== `${repo.owner}/${repo.repo}`) return;
            let branch;
            try { branch = (await github.rest.repos.getBranch({...repo, branch: name})).data; }
            catch (error) { if (error.status === 404) return; throw error; }
            if (branch.protected || branch.commit.sha !== pr.head.sha) {
              core.info('Branch is protected or has new commits; leaving it intact.');
              return;
            }
            const pulls = await github.paginate(github.rest.pulls.list, {...repo, state: 'open', per_page: 100});
            if (pulls.some(other => other.base.ref === name ||
                (other.head.repo?.full_name === `${repo.owner}/${repo.repo}` && other.head.ref === name))) return;
            const ref = `tags/archive/merged-pr-${pr.number}`;
            try {
              const {data} = await github.rest.git.getRef({...repo, ref});
              if (data.object.sha !== pr.head.sha) throw new Error('Existing archive does not match the merged head.');
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({...repo, ref: `refs/${ref}`, sha: pr.head.sha});
            }
            const {data: current} = await github.rest.git.getRef({...repo, ref: `heads/${name}`});
            if (current.object.sha !== pr.head.sha) return;
            await github.rest.git.deleteRef({...repo, ref: `heads/${name}`});
