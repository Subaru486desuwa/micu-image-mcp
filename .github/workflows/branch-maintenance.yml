name: Branch maintenance

on:
  workflow_dispatch:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  audited-cleanup:
    if: >-
      github.repository == 'Subaru486desuwa/micu-image-mcp' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'codex/')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      # Execute only trusted main code even when the triggering PR changed workflows.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Audit history and remove eligible refs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            cargo xtask maintain-branches --event "$GITHUB_EVENT_PATH" --apply
          else
            cargo xtask maintain-branches --apply
          fi
