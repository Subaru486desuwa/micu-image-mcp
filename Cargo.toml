[package]
name = "micu-image-mcp"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Native Rust MCP server for Micu GPT Image 2"
license = "MIT"
repository = "https://github.com/Subaru486desuwa/micu-image-mcp"

[dependencies]
async-trait = "0.1.92"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
bytes = "1.12.1"
cap-std = "4.0.3"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
fs4 = { version = "1.1.0", default-features = false, features = ["tokio"] }
futures-util = "0.3.34"
httpdate = "1.0.3"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
ipnet = "2.12.1"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "rustls", "socks", "stream"] }
rmcp = { version = "3.1.4", default-features = false, features = ["server", "transport-io"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["io"] }
toml_edit = { version = "0.25.13", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
